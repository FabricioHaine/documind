<div class="tela">
  <div class="cartao">
    <div class="marca">
      <span class="logo">DM</span>
      <h1>Criar conta</h1>
      <p class="sub">Seu acervo, suas conversas — dados isolados por usuário.</p>
    </div>

    @if (erro(); as msg) {
      <p-message severity="error">{{ msg }}</p-message>
    }

    <form (ngSubmit)="criarConta()" autocomplete="on">
      <label class="campo">
        <span>Nome</span>
        <input pInputText [(ngModel)]="nome" name="nome" placeholder="Seu nome" required />
      </label>

      <label class="campo">
        <span>E-mail</span>
        <input pInputText type="email" [(ngModel)]="email" name="email"
               placeholder="voce@empresa.com" autocomplete="email" required />
      </label>

      <label class="campo">
        <span>Senha</span>
        <p-password [(ngModel)]="senha" name="senha" [feedback]="true" [toggleMask]="true"
                    placeholder="Mínimo 8 caracteres (letra + número)" autocomplete="new-password" />
        <small class="dica">Ao menos 8 caracteres, com letras e números.</small>
      </label>

      <label class="campo">
        <span>Confirmar senha</span>
        <p-password [(ngModel)]="confirmacao" name="confirmacao" [feedback]="false" [toggleMask]="true"
                    placeholder="Repita a senha" autocomplete="new-password" />
        @if (senhasDiferentes) {
          <small class="erro">As senhas não coincidem.</small>
        }
      </label>

      <p-button type="submit" label="Criar conta" icon="pi pi-user-plus"
                [loading]="enviando()" [disabled]="senhasDiferentes" [fluid]="true" />
    </form>

    <p class="alternativa texto-muted">
      Já tem conta?
      <a routerLink="/login">Entrar</a>
    </p>
  </div>
</div>
